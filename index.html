                description: 'Importação oficial. Bateria com autonomia de até 514km. Software atualizado com Full Self-Driving ativado. Excelente estado.',
                seller: { id: 's4', name: 'E-Drive Sul', type: 'Concessionária', rating: 4.7, verified: true, avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80' }

                images: [
                    'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=1000&q=80',
                    'https://images.unsplash.com/photo-1559416523-140ddc3d238c?auto=format&fit=crop&w=1000&q=80'
                ],
                features: ['Tração 4WD 4Auto', 'Painel Digital 12.4"', 'Assistente de Permanência em Faixa', 'Piloto Adaptativo', 'Capota Marítima Elétrica'],
                description: 'Nova Ford Ranger V6. Motor fortíssimo com 250cv. Estado de zero, com protetor de caçamba e santantônio original.',
                seller: { id: 's5', name: 'Marcos Viana', type: 'Particular', rating: 4.9, verified: false, avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80' }
            }
        ];

        // Formatters
        const formatBRL = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(val);
        const formatKM = (val) => `${new Intl.NumberFormat('pt-BR').format(val)} km`;

        // Main App Component
        function App() {
            const [vehicles, setVehicles] = useState(INITIAL_VEHICLES);
            const [favorites, setFavorites] = useState(['v1']);
            const [activeTab, setActiveTab] = useState('home'); // home, explore, sell, favorites, profile
            const [selectedVehicle, setSelectedVehicle] = useState(null);
            const [selectedSeller, setSelectedSeller] = useState(null);
            const [activeChat, setActiveChat] = useState(null);

            // Filter States
            const [filters, setFilters] = useState({
                search: '',
                brand: '',
                bodyType: '',
                minPrice: 0,
                maxPrice: 2000000,
                maxKm: 200000,
                type: '',
                fuel: '',
                transmission: '',
                sort: 'recent'
            });

            // Re-render icon utility
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            // Toggle Favorites
            const toggleFavorite = (id) => {
                setFavorites(prev => prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]);
            };

            // Filtered vehicles logic
            const filteredVehicles = useMemo(() => {
                return vehicles.filter(v => {
                    const matchSearch = !filters.search || 
                        v.title.toLowerCase().includes(filters.search.toLowerCase()) || 
                        v.brand.toLowerCase().includes(filters.search.toLowerCase());
                    const matchBrand = !filters.brand || v.brand.toLowerCase() === filters.brand.toLowerCase();
                    const matchCategory = !filters.bodyType || v.bodyType.toLowerCase() === filters.bodyType.toLowerCase();
                    const matchPrice = v.price >= filters.minPrice && v.price <= filters.maxPrice;
                    const matchKm = v.km <= filters.maxKm;
                    const matchType = !filters.type || v.type === filters.type;
                    const matchFuel = !filters.fuel || v.fuel.includes(filters.fuel);
                    const matchTrans = !filters.transmission || v.transmission.toLowerCase().includes(filters.transmission.toLowerCase());

                    return matchSearch && matchBrand && matchCategory && matchPrice && matchKm && matchType && matchFuel && matchTrans;
                }).sort((a, b) => {
                    if (filters.sort === 'price_asc') return a.price - b.price;
                    if (filters.sort === 'price_desc') return b.price - a.price;
                    if (filters.sort === 'km_asc') return a.km - b.km;
                    if (filters.sort === 'year_desc') return b.year - a.year;
                    return b.id.localeCompare(a.id);
                });
            }, [vehicles, filters]);

            // Active Vehicle Modal/View overlay
            const openVehicleDetails = (vehicle) => {
                setSelectedVehicle(vehicle);
            };

            return (
                <div className="flex flex-col min-h-screen pb-20 max-w-md mx-auto bg-dark-900 border-x border-slate-800/80 shadow-2xl relative">
                    
                    {/* Header */}
                    <header className="sticky top-0 z-30 glass px-4 py-3 flex items-center justify-between border-b border-slate-800">
                        <div className="flex items-center space-x-2 cursor-pointer" onClick={() => { setActiveTab('home'); setSelectedVehicle(null); }}>
                            <div className="w-8 h-8 rounded-lg bg-brand flex items-center justify-center text-dark-900 font-extrabold text-lg tracking-tighter">
                                S
                            </div>
                            <div>
                                <h1 className="text-base font-bold tracking-tight text-white flex items-center leading-none">
                                    Shift<span className="text-brand">Auto</span>
                                </h1>
                                <p className="text-[10px] text-slate-400 font-medium">Marketplace Automotivo</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-3">
                            <button className="flex items-center space-x-1 text-xs text-slate-300 bg-dark-800 px-2.5 py-1.5 rounded-full border border-slate-700">
                                <i data-lucide="map-pin" className="w-3.5 h-3.5 text-brand"></i>
                                <span className="font-medium">São Paulo, SP</span>
                            </button>
                            <button className="relative p-2 text-slate-300 hover:text-white rounded-full bg-dark-800 border border-slate-700">
                                <i data-lucide="bell" className="w-4 h-4"></i>
                                <span className="absolute top-1 right-1 w-2 h-2 bg-brand rounded-full"></span>
                            </button>
                        </div>
                    </header>

                    {/* Main Dynamic View */}
                    <main className="flex-1 p-4 space-y-6">
                        {activeTab === 'home' && (
                            <HomeView 
                                vehicles={vehicles}
                                filteredVehicles={filteredVehicles}
                                favorites={favorites}
                                toggleFavorite={toggleFavorite}
                                openVehicleDetails={openVehicleDetails}
                                setFilters={setFilters}
                                setActiveTab={setActiveTab}
                            />
                        )}

                        {activeTab === 'explore' && (
                            <ExploreView 
                                filteredVehicles={filteredVehicles}
                                favorites={favorites}
                                toggleFavorite={toggleFavorite}
                                openVehicleDetails={openVehicleDetails}
                                filters={filters}
                                setFilters={setFilters}
                            />
                        )}

                        {activeTab === 'sell' && (
                            <SellView 
                                onPublish={(newVehicle) => {
                                    setVehicles([newVehicle, ...vehicles]);
                                    setActiveTab('explore');
                                }}
                            />
                        )}

                        {activeTab === 'favorites' && (
                            <FavoritesView 
                                vehicles={vehicles.filter(v => favorites.includes(v.id))}
                                favorites={favorites}
                                toggleFavorite={toggleFavorite}
                                openVehicleDetails={openVehicleDetails}
                                setActiveTab={setActiveTab}
                            />
                        )}

                        {activeTab === 'profile' && (
                            <ProfileView 
                                userVehicles={vehicles.filter(v => v.seller.name === 'Você')}
                                openVehicleDetails={openVehicleDetails}
                                setActiveTab={setActiveTab}
                            />
                        )}
                    </main>

                    {/* Detail Modal Layer */}
                    {selectedVehicle && (
                        <VehicleDetailModal 
                            vehicle={selectedVehicle} 
                            onClose={() => setSelectedVehicle(null)}
                            isFavorite={favorites.includes(selectedVehicle.id)}
                            toggleFavorite={toggleFavorite}
                            onOpenChat={(seller, vehicle) => {
                                setActiveChat({ seller, vehicle });
                            }}
                            onOpenSeller={(seller) => setSelectedSeller(seller)}
                        />
                    )}

                    {/* Seller Profile Overlay Modal */}
                    {selectedSeller && (
                        <SellerProfileModal 
                            seller={selectedSeller} 
                            vehicles={vehicles.filter(v => v.seller.id === selectedSeller.id || v.seller.name === selectedSeller.name)}
                            onClose={() => setSelectedSeller(null)}
                            openVehicleDetails={openVehicleDetails}
                        />
                    )}

                    {/* Interactive Chat Overlay Modal */}
                    {activeChat && (
                        <ChatModal 
                            chat={activeChat} 
                            onClose={() => setActiveChat(null)} 
                        />
                    )}

                    {/* Bottom Fixed Navigation Bar */}
                    <nav className="fixed bottom-0 left-0 right-0 z-40 max-w-md mx-auto glass border-t border-slate-800 px-3 py-2 flex items-center justify-around">
                        <NavItem 
                            icon="home" 
                            label="Início" 
                            active={activeTab === 'home' && !selectedVehicle} 
                            onClick={() => { setActiveTab('home'); setSelectedVehicle(null); }} 
                        />
                        <NavItem 
                            icon="search" 
                            label="Explorar" 
                            active={activeTab === 'explore' && !selectedVehicle} 
                            onClick={() => { setActiveTab('explore'); setSelectedVehicle(null); }} 
                        />
                        <NavItem 
                            icon="plus-circle" 
                            label="Anunciar" 
                            active={activeTab === 'sell' && !selectedVehicle} 
                            highlighted
                            onClick={() => { setActiveTab('sell'); setSelectedVehicle(null); }} 
                        />
                        <NavItem 
                            icon="heart" 
                            label="Favoritos" 
                            badge={favorites.length}
                            active={activeTab === 'favorites' && !selectedVehicle} 
                            onClick={() => { setActiveTab('favorites'); setSelectedVehicle(null); }} 
                        />
                        <NavItem 
                            icon="user" 
                            label="Perfil" 
                            active={activeTab === 'profile' && !selectedVehicle} 
                            onClick={() => { setActiveTab('profile'); setSelectedVehicle(null); }} 
                        />
                    </nav>
                </div>
            );
        }

        // Bottom Navigation Item Component
        function NavItem({ icon, label, active, highlighted, badge, onClick }) {
            return (
                <button 
                    onClick={onClick} 
                    className={`flex flex-col items-center justify-center relative py-1 px-3 transition-all ${
                        active ? 'text-brand font-semibold scale-105' : 'text-slate-400 hover:text-slate-200'
                    }`}
                >
                    {highlighted ? (
                        <div className="w-10 h-10 rounded-full bg-brand text-dark-900 flex items-center justify-center shadow-lg shadow-brand/20 -mt-5 border-4 border-dark-900">
                            <i data-lucide={icon} className="w-5 h-5 stroke-[2.5]"></i>
                        </div>
                    ) : (
                        <div className="relative">
                            <i data-lucide={icon} className="w-5 h-5"></i>
                            {badge > 0 && (
                                <span className="absolute -top-1.5 -right-2 bg-brand text-dark-900 text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">
                                    {badge}
                                </span>
                            )}
                        </div>
                    )}
                    <span className={`text-[11px] mt-1 ${highlighted ? 'mt-0 font-medium text-brand' : ''}`}>{label}</span>
                </button>
            );
        }

        // Home View Component
        function HomeView({ vehicles, filteredVehicles, favorites, toggleFavorite, openVehicleDetails, setFilters, setActiveTab }) {
            const categories = [
                { name: 'SUVs', icon: 'shield' },
                { name: 'Sedãs', icon: 'car' },
                { name: 'Esportivos', icon: 'zap' },
                { name: 'Picapes', icon: 'truck' },
                { name: 'Elétricos', icon: 'battery-charging' },
                { name: 'Novos', icon: 'sparkles' }
            ];

            return (
                <div className="space-y-6">
                    
                    {/* Quick Search Input */}
                    <div className="relative">
                        <i data-lucide="search" className="absolute left-3.5 top-3.5 text-slate-400 w-4 h-4"></i>
                        <input 
                            type="text" 
                            placeholder="Qual carro você está procurando?" 
                            className="w-full bg-dark-800 border border-slate-700 rounded-xl py-3 pl-10 pr-10 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand transition-colors"
                            onClick={() => setActiveTab('explore')}
                            readOnly
                        />
                        <button 
                            onClick={() => setActiveTab('explore')}
                            className="absolute right-2.5 top-2.5 bg-dark-700 hover:bg-slate-700 text-slate-300 p-1.5 rounded-lg border border-slate-600"
                        >
                            <i data-lucide="sliders-horizontal" className="w-4 h-4"></i>
                        </button>
                    </div>

                    {/* Quick Category Badges */}
                    <div>
                        <div className="flex items-center justify-between mb-3">
                            <h2 className="text-sm font-bold text-slate-200 uppercase tracking-wider">Categorias</h2>
                            <button onClick={() => setActiveTab('explore')} className="text-xs text-brand hover:underline font-medium">Ver todas</button>
                        </div>
                        <div className="flex space-x-2 overflow-x-auto no-scrollbar pb-1">
                            {categories.map((cat, idx) => (
                                <button 
                                    key={idx}
                                    onClick={() => {
                                        if (cat.name === 'Novos') setFilters(f => ({ ...f, type: 'Novo', bodyType: '' }));
                                        else setFilters(f => ({ ...f, bodyType: cat.name === 'SUVs' ? 'SUV' : cat.name === 'Sedãs' ? 'Sedã' : cat.name, type: '' }));
                                        setActiveTab('explore');
                                    }}
                                    className="flex items-center space-x-2 bg-dark-800 hover:bg-slate-800 border border-slate-700/80 px-3.5 py-2 rounded-xl whitespace-nowrap text-xs font-medium text-slate-300 transition-all active:scale-95 flex-shrink-0"
                                >
                                    <i data-lucide={cat.icon} className="w-4 h-4 text-brand"></i>
                                    <span>{cat.name}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Hero Promotional Banner */}
                    <div className="relative rounded-2xl overflow-hidden border border-slate-800 bg-gradient-to-r from-dark-800 to-slate-900 p-5 shadow-xl">
                        <div className="relative z-10 space-y-2 max-w-[65%]">
                            <span className="inline-block bg-brand/20 text-brand border border-brand/30 text-[10px] uppercase tracking-wider font-extrabold px-2.5 py-0.5 rounded-full">
                                Exclusividade
                            </span>
                            <h3 className="text-lg font-extrabold text-white leading-tight">Encontre a sua próxima máquina</h3>
                            <p className="text-xs text-slate-400 line-clamp-2">Carros inspecionados, garantia de procedência e melhores condições de mercado.</p>
                            <button 
                                onClick={() => setActiveTab('explore')}
                                className="mt-2 bg-brand text-dark-900 hover:bg-brand-hover font-bold text-xs px-4 py-2 rounded-lg flex items-center space-x-1 transition-all"
                            >
                                <span>Explorar Anúncios</span>
                                <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                        <img 
                            src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80" 
                            alt="Porsche" 
                            className="absolute -right-8 -bottom-4 w-48 h-full object-cover opacity-50 mix-blend-lighten pointer-events-none"
                        />
                    </div>

                                                    type="button"
                                                    onClick={() => setFormData(prev => ({ ...prev, images: prev.images.filter((_, i) => i !== idx) }))}
                                                    className="absolute top-1 right-1 bg-rose-600/90 text-white p-1 rounded-full text-[10px]"
                                                >
                                                    <i data-lucide="x" className="w-3 h-3"></i>
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Step 4: Description */}
                    {step === 4 && (
                        <div className="space-y-4">
                            <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-2">4. Descrição e Detalhes</h3>
                            <textarea 
                                rows="5"
                                placeholder="Descreva os diferenciais do veículo, histórico de manutenção, estado dos pneus, revisões, etc..."
                                value={formData.description}
                                onChange={e => setFormData({ ...formData, description: e.target.value })}
                                className="w-full bg-dark-800 border border-slate-700 rounded-xl p-3 text-xs text-white focus:border-brand"
                            ></textarea>
                        </div>
                    )}

                    {/* Step 5: Review & Confirm */}
                    {step === 5 && (
                        <div className="space-y-4">
                            <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-2">5. Revisão do Anúncio</h3>
                            <div className="bg-dark-800 p-4 rounded-xl space-y-2 text-xs border border-slate-700">
                                <div className="flex justify-between font-bold text-white">
                                    <span>{formData.brand} {formData.model}</span>
                                    <span className="text-brand">{formatBRL(formData.price || 0)}</span>
                                </div>
                                <p className="text-slate-400">{formData.version} • {formData.year}</p>
                                <p className="text-slate-400">{formatKM(formData.km || 0)} • {formData.location}</p>
                            </div>
                        </div>
                    )}

                    {/* Form Navigation Controls */}
                    <div className="flex space-x-3 pt-4">
                        {step > 1 && (
                            <button 
                                onClick={handlePrev}
                                className="flex-1 bg-dark-800 border border-slate-700 text-slate-300 font-bold py-3 rounded-xl text-xs"
                            >
                                Voltar
                            </button>
                        )}
                        {step < 5 ? (
                            <button 
                                onClick={handleNext}
                                className="flex-1 bg-brand hover:bg-brand-hover text-dark-900 font-bold py-3 rounded-xl text-xs shadow-lg shadow-brand/20"
                            >
                                Próxima Etapa
                            </button>
                        ) : (
                            <button 
                                onClick={handleSubmit}
                                className="flex-1 bg-brand hover:bg-brand-hover text-dark-900 font-bold py-3 rounded-xl text-xs shadow-lg shadow-brand/20"
                            >
                                Publicar Anúncio Agora
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // Favorites View Component
        function FavoritesView({ vehicles, favorites, toggleFavorite, openVehicleDetails, setActiveTab }) {
            return (
                <div className="space-y-4">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                        <h2 className="font-extrabold text-base text-white">Seus Veículos Salvos</h2>
                        <span className="text-xs text-brand font-bold">{vehicles.length} favoritos</span>
                    </div>

                    {vehicles.length > 0 ? (
                        <div className="grid grid-cols-1 gap-4">
                            {vehicles.map(vehicle => (
                                <VehicleCard 
                                    key={vehicle.id} 
                                    vehicle={vehicle} 
                                    isFavorite={true}
                                    toggleFavorite={toggleFavorite}
                                    onClick={() => openVehicleDetails(vehicle)}
                                />
                            ))}
                        </div>
                    ) : (
                        <div className="text-center py-16 px-4 space-y-3 bg-dark-800/40 rounded-2xl border border-slate-800">
                            <div className="w-12 h-12 rounded-full bg-dark-700 flex items-center justify-center mx-auto text-slate-400">
                                <i data-lucide="heart-off" className="w-6 h-6"></i>
                            </div>
                            <h3 className="font-bold text-slate-200 text-sm">Você ainda não tem salvos</h3>
                            <p className="text-xs text-slate-400 max-w-xs mx-auto">Explore nosso catálogo e clique no ícone de coração para acompanhar seus modelos favoritos.</p>
                            <button 
                                onClick={() => setActiveTab('explore')}
                                className="mt-2 bg-brand text-dark-900 font-bold text-xs px-4 py-2 rounded-lg"
                            >
                                Explorar Anúncios
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // Profile View Component
        function ProfileView({ userVehicles, openVehicleDetails, setActiveTab }) {
            return (
                <div className="space-y-6">
                    {/* User Card */}
                    <div className="bg-dark-800 p-4 rounded-2xl border border-slate-700 flex items-center space-x-3">
                        <img 
                            src="./img/01.png"
                            className="w-14 h-14 rounded-full border-2 border-brand object-cover" 
                        />
                        <div>
                            <h3 className="font-bold text-white text-base">Luiz Laossa</h3>
                            <p className="text-xs text-slate-400">Gustavo2002luiz@hotmail.com</p>
                            <span className="inline-block mt-1 bg-brand/20 text-brand text-[10px] font-bold px-2 py-0.5 rounded">Membro Verificado</span>
                        </div>
                    </div>

                    {/* Stats */}
                    <div className="grid grid-cols-3 gap-2 text-center">
                        <div className="bg-dark-800 p-3 rounded-xl border border-slate-800">
                            <span className="text-lg font-bold text-brand block">{userVehicles.length}</span>
                            <span className="text-[10px] text-slate-400">Anúncios</span>
                        </div>
                        <div className="bg-dark-800 p-3 rounded-xl border border-slate-800">
                            <span className="text-lg font-bold text-white block">12</span>
                            <span className="text-[10px] text-slate-400">Propostas</span>
                        </div>
                        <div className="bg-dark-800 p-3 rounded-xl border border-slate-800">
                            <span className="text-lg font-bold text-white block">4.9</span>
                            <span className="text-[10px] text-slate-400">Avaliação</span>
                        </div>
                    </div>

                    {/* User Vehicles Section */}
                    <div className="space-y-3">
                        <div className="flex justify-between items-center">
                            <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">Meus Anúncios Publicados</h3>
                            <button onClick={() => setActiveTab('sell')} className="text-xs text-brand hover:underline font-bold">+ Novo</button>
                        </div>

                        {userVehicles.length > 0 ? (
                            <div className="space-y-2">
                                {userVehicles.map(vehicle => (
                                    <div 
                                        key={vehicle.id} 
                                        onClick={() => openVehicleDetails(vehicle)}
                                        className="bg-dark-800 p-3 rounded-xl border border-slate-700 flex items-center justify-between cursor-pointer"
                                    >
                                        <div className="flex items-center space-x-3">
                                            <img src={vehicle.images[0]} className="w-12 h-12 rounded-lg object-cover" />
                                            <div>
                                                <h4 className="font-bold text-xs text-white">{vehicle.title}</h4>
                                                <p className="text-[10px] text-brand font-bold">{formatBRL(vehicle.price)}</p>
                                            </div>
                                        </div>
                                        <span className="bg-emerald-500/20 text-emerald-400 text-[10px] font-bold px-2 py-1 rounded">Ativo</span>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <p className="text-xs text-slate-500 italic">Você não publicou nenhum anúncio até o momento.</p>
                        )}
                    </div>

                    {/* Account Settings List */}
                    <div className="bg-dark-800 rounded-2xl border border-slate-800 divide-y divide-slate-800 text-xs">
                        <div className="p-3.5 flex items-center justify-between text-slate-300 hover:text-white cursor-pointer">
                            <div className="flex items-center space-x-3">
                                <i data-lucide="message-square" className="w-4 h-4 text-brand"></i>
                                <span>Minhas Conversas</span>
                            </div>
                            <i data-lucide="chevron-right" className="w-4 h-4 text-slate-500"></i>
                        </div>
                        <div className="p-3.5 flex items-center justify-between text-slate-300 hover:text-white cursor-pointer">
                            <div className="flex items-center space-x-3">
                                <i data-lucide="settings" className="w-4 h-4 text-brand"></i>
                                <span>Configurações da Conta</span>
                            </div>
                            <i data-lucide="chevron-right" className="w-4 h-4 text-slate-500"></i>
                        </div>
                        <div className="p-3.5 flex items-center justify-between text-rose-400 hover:text-rose-300 cursor-pointer">
                            <div className="flex items-center space-x-3">
                                <i data-lucide="log-out" className="w-4 h-4"></i>
                                <span>Sair do Aplicativo</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Detailed Vehicle View Modal
        function VehicleDetailModal({ vehicle, onClose, isFavorite, toggleFavorite, onOpenChat, onOpenSeller }) {
            const [selectedImg, setSelectedImg] = useState(0);
            const fallbackImage = 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=1000&q=80';

            return (
                <div className="fixed inset-0 z-50 bg-dark-900/95 backdrop-blur-md overflow-y-auto max-w-md mx-auto flex flex-col no-scrollbar">
                    {/* Top Bar Floating Controls */}
                    <div className="sticky top-0 z-20 glass px-4 py-3 flex items-center justify-between border-b border-slate-800">
                        <button onClick={onClose} className="p-2 rounded-full bg-dark-800 text-slate-300 hover:text-white border border-slate-700">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <span className="text-xs font-bold text-slate-300">{vehicle.brand} {vehicle.model}</span>
                        <div className="flex space-x-2">
                            <button 
                                onClick={() => toggleFavorite(vehicle.id)}
                                className="p-2 rounded-full bg-dark-800 text-slate-300 hover:text-rose-500 border border-slate-700"
                            >
                                <i data-lucide="heart" className={`w-5 h-5 ${isFavorite ? 'fill-rose-500 text-rose-500' : ''}`}></i>
                            </button>
                        </div>
                    </div>

                    {/* Image Gallery */}
                    <div className="space-y-2">
                        <div className="relative h-64 bg-dark-800">
                            <img 
                                src={vehicle.images[selectedImg] || fallbackImage} 
                                onError={(e) => { e.target.onerror = null; e.target.src = fallbackImage; }}
                                className="w-full h-full object-cover" 
                            />
                            <span className="absolute bottom-3 right-3 bg-dark-900/80 text-white text-[10px] font-bold px-2 py-1 rounded-md border border-slate-700">
                                {selectedImg + 1} / {vehicle.images.length}
                            </span>
                        </div>

                        {/* Thumbnails */}
                        {vehicle.images.length > 1 && (
                            <div className="flex space-x-2 px-4 overflow-x-auto no-scrollbar">
                                {vehicle.images.map((img, i) => (
                                    <button 
                                        key={i} 
                                        onClick={() => setSelectedImg(i)}
                                        className={`w-16 h-12 rounded-lg overflow-hidden border-2 flex-shrink-0 bg-dark-800 ${
                                            selectedImg === i ? 'border-brand' : 'border-slate-700 opacity-70'
                                        }`}
                                    >
                                        <img 
                                            src={img || fallbackImage} 
                                            onError={(e) => { e.target.onerror = null; e.target.src = fallbackImage; }}
                                            className="w-full h-full object-cover" 
                                        />
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Vehicle Details Content */}
                    <div className="p-4 space-y-6 flex-1 pb-24">
                        {/* Title & Price */}
                        <div>
                            <span className="text-xs text-brand font-bold uppercase tracking-wider">{vehicle.brand}</span>
                            <h1 className="text-xl font-extrabold text-white leading-tight">{vehicle.title}</h1>
                            <p className="text-xs text-slate-400 mt-0.5">{vehicle.version}</p>
                            <div className="mt-3 flex items-baseline justify-between">
                                <span className="text-2xl font-black text-brand">{formatBRL(vehicle.price)}</span>
                                <span className="text-xs text-slate-400">{vehicle.location}</span>
                            </div>
                        </div>

                        {/* Technical Grid Specs */}
                        <div className="grid grid-cols-2 gap-2 text-xs">
                            <div className="bg-dark-800 p-3 rounded-xl border border-slate-800">
                                <span className="text-slate-500 block text-[10px]">Ano</span>
                                <span className="font-bold text-slate-200">{vehicle.year}</span>
                            </div>
                            <div className="bg-dark-800 p-3 rounded-xl border border-slate-800">
                                <span className="text-slate-500 block text-[10px]">Quilometragem</span>
                                <span className="font-bold text-slate-200">{formatKM(vehicle.km)}</span>
                            </div>
                            <div className="bg-dark-800 p-3 rounded-xl border border-slate-800">
                                <span className="text-slate-500 block text-[10px]">Combustível</span>
                                <span className="font-bold text-slate-200">{vehicle.fuel}</span>
                            </div>
                            <div className="bg-dark-800 p-3 rounded-xl border border-slate-800">
                                <span className="text-slate-500 block text-[10px]">Câmbio</span>
                                <span className="font-bold text-slate-200">{vehicle.transmission}</span>
                            </div>
                        </div>

                        {/* Description */}
                        <div className="space-y-2">
                            <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">Descrição do Vendedor</h3>
                            <p className="text-xs text-slate-400 leading-relaxed bg-dark-800/50 p-3 rounded-xl border border-slate-800">{vehicle.description}</p>
                        </div>

                        {/* Equipment List */}
                        <div className="space-y-2">
                            <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">Itens e Opcionais</h3>
                            <div className="grid grid-cols-2 gap-2">
                                {vehicle.features.map((feat, i) => (
                                    <div key={i} className="flex items-center space-x-2 text-xs text-slate-300 bg-dark-800 p-2 rounded-lg border border-slate-800">
                                        <i data-lucide="check" className="w-3.5 h-3.5 text-brand"></i>
                                        <span>{feat}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Seller Box */}
                        <div 
                            onClick={() => onOpenSeller(vehicle.seller)}
                            className="bg-dark-800 p-3.5 rounded-xl border border-slate-700 flex items-center justify-between cursor-pointer hover:border-brand transition-colors"
                        >
                            <div className="flex items-center space-x-3">
                                <img src={vehicle.seller.avatar} className="w-10 h-10 rounded-full object-cover" />
                                <div>
                                    <h4 className="font-bold text-xs text-white">{vehicle.seller.name}</h4>
                                    <p className="text-[10px] text-slate-400">{vehicle.seller.type} • ★ {vehicle.seller.rating}</p>
                                </div>
                            </div>
                            <i data-lucide="chevron-right" className="w-4 h-4 text-slate-400"></i>
                        </div>
                    </div>

                    {/* Bottom Fixed Sticky Action bar */}
                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-3 glass border-t border-slate-800 flex space-x-2 z-30">
                        <button 
                            onClick={() => onOpenChat(vehicle.seller, vehicle)}
                            className="flex-1 bg-brand hover:bg-brand-hover text-dark-900 font-bold py-3 rounded-xl text-xs flex items-center justify-center space-x-2 shadow-lg shadow-brand/20"
                        >
                            <i data-lucide="message-circle" className="w-4 h-4"></i>
                            <span>Conversar com Vendedor</span>
                        </button>
                    </div>
                </div>
            );
        }

        // Seller Profile Modal
        function SellerProfileModal({ seller, vehicles, onClose, openVehicleDetails }) {
            return (
                <div className="fixed inset-0 z-50 bg-dark-900/95 backdrop-blur-md overflow-y-auto max-w-md mx-auto flex flex-col p-4 space-y-5">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                        <h2 className="font-bold text-sm text-white">Perfil do Vendedor</h2>
                        <button onClick={onClose} className="p-1 text-slate-400 hover:text-white">
                            <i data-lucide="x" className="w-5 h-5"></i>
                        </button>
                    </div>

                    <div className="text-center space-y-2">
                        <img src={seller.avatar} className="w-20 h-20 rounded-full mx-auto object-cover border-2 border-brand" />
                        <h3 className="font-extrabold text-base text-white">{seller.name}</h3>
                        <p className="text-xs text-slate-400">{seller.type}</p>
                        <div className="inline-flex items-center space-x-1 bg-dark-800 px-3 py-1 rounded-full text-xs font-bold text-amber-400 border border-slate-700">
                            <span>★ {seller.rating}</span>
                        </div>
                    </div>

                    <div className="space-y-3 pt-3">
                        <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wider">Outros anúncios deste vendedor ({vehicles.length})</h4>
                        <div className="space-y-2">
                            {vehicles.map(v => (
                                <div 
                                    key={v.id} 
                                    onClick={() => {
                                        onClose();
                                        openVehicleDetails(v);
                                    }}
                                    className="bg-dark-800 p-3 rounded-xl border border-slate-700 flex items-center justify-between cursor-pointer"
                                >
                                    <div className="flex items-center space-x-3">
                                        <img src={v.images[0]} className="w-12 h-12 rounded-lg object-cover" />
                                        <div>
                                            <h5 className="font-bold text-xs text-white">{v.title}</h5>
                                            <p className="text-[10px] text-brand font-bold">{formatBRL(v.price)}</p>
                                        </div>
                                    </div>
                                    <i data-lucide="chevron-right" className="w-4 h-4 text-slate-500"></i>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // Live Dynamic Interactive Chat Modal
        function ChatModal({ chat, onClose }) {
            const [messages, setMessages] = useState([
                { id: 1, text: `Olá! Tenho interesse no ${chat.vehicle.title}. Ainda está disponível?`, sender: 'me' },
                { id: 2, text: `Olá! Sim, está disponível em nosso show room. Gostaria de agendar um test drive?`, sender: 'them' }
            ]);
            const [inputText, setInputText] = useState('');

            const sendMessage = (e) => {
                e.preventDefault();
                if (!inputText.trim()) return;

                const newMsg = { id: Date.now(), text: inputText, sender: 'me' };
                setMessages(prev => [...prev, newMsg]);
                setInputText('');

                // Auto response simulation
                setTimeout(() => {
                    setMessages(prev => [
                        ...prev,
                        { id: Date.now() + 1, text: 'Perfeito! Nosso consultor entrará em contato em instantes para combinar todos os detalhes.', sender: 'them' }
                    ]);
                }, 1200);
            };

            return (
                <div className="fixed inset-0 z-50 bg-dark-900 max-w-md mx-auto flex flex-col">
                    {/* Header */}
                    <div className="glass p-3 flex items-center space-x-3 border-b border-slate-800">
                        <button onClick={onClose} className="text-slate-400 hover:text-white p-1">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <img src={chat.seller.avatar} className="w-9 h-9 rounded-full object-cover" />
                        <div>
                            <h3 className="font-bold text-xs text-white">{chat.seller.name}</h3>
                            <p className="text-[10px] text-slate-400">Anúncio: {chat.vehicle.title}</p>
                        </div>
                    </div>

                    {/* Messages Body */}
                    <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs no-scrollbar">
                        {messages.map(m => (
                            <div key={m.id} className={`flex ${m.sender === 'me' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[80%] p-3 rounded-2xl ${
                                    m.sender === 'me' 
                                        ? 'bg-brand text-dark-900 font-medium rounded-br-none' 
                                        : 'bg-dark-800 text-slate-200 border border-slate-700 rounded-bl-none'
                                }`}>
                                    {m.text}
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Chat Input */}
                    <form onSubmit={sendMessage} className="p-3 glass border-t border-slate-800 flex space-x-2">
                        <input 
                            type="text" 
                            value={inputText}
                            onChange={e => setInputText(e.target.value)}
                            placeholder="Escreva sua mensagem..." 
                            className="flex-1 bg-dark-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand"
                        />
                        <button type="submit" className="bg-brand text-dark-900 p-2.5 rounded-xl font-bold">
                            <i data-lucide="send" className="w-4 h-4"></i>
                        </button>
                    </form>
                </div>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
